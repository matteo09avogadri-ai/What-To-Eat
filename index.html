<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosa mangio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6B3A">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F5F8EE;--ink:#1D2B1A;--soft:#5E6D58;--card:#FFFFFF;--line:#D9E2CC;--green:#2F6B3A;--saffron:#F2B705;--red:#B8402F;--ok:#E3F1DA;--no:#FBE7E2}
@media (prefers-color-scheme:dark){:root{--bg:#141C12;--ink:#EAF1E1;--soft:#9AAB92;--card:#1E2A1B;--line:#33442E;--green:#7FC48A;--red:#EE8A78;--ok:#25391F;--no:#3E2420}}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;font-size:16px;line-height:1.4;min-height:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
header h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Georgia,serif;font-size:22px;margin:0}
.ib{padding:6px 11px;font-size:18px;line-height:1.2}
.av{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font:700 20px Georgia,serif;display:flex;align-items:center;justify-content:center;flex:none;border:0}
.av.s{width:34px;height:34px;font-size:16px}
main{padding:4px 16px calc(100px + env(safe-area-inset-bottom,0px))}
h2{font-family:Georgia,serif;font-size:19px;margin:20px 0 8px}
p.sub{margin:0 0 12px;color:var(--soft);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:8px 4px;border:0;background:none;color:var(--soft);font:inherit;font-size:12px;font-weight:700}
nav button span{display:block;font-size:24px;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--green);box-shadow:inset 0 3px 0 var(--saffron)}
nav button.on span{filter:none;opacity:1}
input,select{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%;margin-top:8px}
input::placeholder{color:#9AA79A}
.b{font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:10px;background:var(--green);color:#fff}
.b.w{width:100%;margin-top:12px}
.g{font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink)}
.g.on{background:var(--saffron);border-color:var(--saffron);color:#1D2B1A;font-weight:700}
.g.r{color:var(--red)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.next{border:2.5px solid var(--saffron)}
.next h3{font-family:Georgia,serif;font-size:22px;margin:2px 0 8px}
.when{font-size:14px;color:var(--soft);font-weight:700}
.ing{display:inline-block;padding:4px 10px;margin:3px 4px 0 0;border-radius:8px;font-size:15px;font-weight:700}
.ing.y{background:var(--ok);color:var(--green)}.ing.n{background:var(--no);color:var(--red)}
.empty{color:var(--soft);padding:10px 0}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 3px;vertical-align:middle;text-align:center;word-wrap:break-word}
th{background:var(--card)}
td{background:var(--card);height:52px}
td.has{background:var(--ok);font-weight:700}
td div{margin:2px 0}
td .d{text-decoration:line-through;opacity:.5}
td.nx{outline:3px solid var(--saffron);outline-offset:-3px}
.food{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.food .e{font-size:30px;text-align:center}
.food .nm{font-weight:700;font-size:17px}
.food .d{grid-column:2/4;font-size:14px;color:var(--soft)}
.food .d b{color:var(--ink)}
.soon{color:var(--red)!important}
.m{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.m span.n{flex:1;font-weight:700}
.cp{margin:0 0 0 18px;border-left:4px solid var(--saffron);padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1D2B1A;color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;z-index:20;max-width:90%;text-align:center;display:none}
.toast b{margin-left:12px;color:var(--saffron);cursor:pointer}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9;overscroll-behavior:contain}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:80%;overflow-y:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.c{margin:auto;border-radius:18px;max-height:90%}
label.l{display:block;margin-top:12px;font-size:14px;color:var(--soft);font-weight:700}
summary{font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <button class="av" id="av" onclick="cambiaNome()"></button>
  <h1 id="tit" onclick="vai('famiglia')">Cosa mangio</h1>
  <button class="g ib hide" id="un" onclick="annulla()" aria-label="Annulla">↶</button>
  <button class="g ib" onclick="aggiorna()" aria-label="Aggiorna">↻</button>
  <button class="g ib hide" id="home" onclick="vai('home')" aria-label="Home">🏠</button>
</header>
<main>
  <section id="p-home">
    <div id="avviso"></div>
    <div id="prossimo"></div>
    <h2>La settimana</h2>
    <table id="tab"></table>
  </section>
  <section id="p-dispensa" class="hide">
    <p class="sub">La dispensa è condivisa: tutti i membri della famiglia la vedono e la modificano.</p>
    <button class="b w" style="margin:0 0 6px" onclick="document.getElementById('fd').classList.toggle('hide')">+ Aggiungi cibo</button>
    <div class="card hide" id="fd">
      <input id="dN" placeholder="Nome (es. uova)">
      <input id="dS" type="text" placeholder="Data di scadenza" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
      <input id="dQ" placeholder="Quantità (es. 6 oppure 500 g)">
      <button class="b w" onclick="addCibo()">Salva</button>
    </div>
    <div id="lista"></div>
  </section>
  <section id="p-famiglia" class="hide">
    <div id="famList"></div>
    <details class="card"><summary>➕ Crea o entra in un'altra famiglia</summary>
      <input id="cNome" placeholder="Nome della nuova famiglia">
      <button class="b w" onclick="creaFam($('cNome').value)">Crea la famiglia</button>
      <input id="cE" placeholder="Oppure un codice famiglia" style="text-transform:uppercase">
      <button class="g" style="width:100%;margin-top:8px" onclick="entra($('cE').value)">Entra con il codice</button>
    </details>
    <div id="famDet"></div>
  </section>
  <section id="p-piatti" class="hide">
    <div class="card">
      <div id="cBan"></div><b>Componi un piatto</b>
      <input id="pN" placeholder="Nome del piatto">
      <p class="sub" style="margin:10px 0 0">Tocca gli ingredienti che hai in dispensa:</p>
      <div id="pChips"></div><div id="pQty"></div>
      <input id="pX" placeholder="Altri ingredienti con quantità: pasta 100 g, uova 2">
      <button class="b w" id="pSalva" onclick="salvaPiatto()">Salva piatto</button>
    </div>
    <h2>I miei piatti</h2>
    <div id="pList"></div>
  </section>
  <section id="p-storico" class="hide">
    <p class="sub">Le settimane passate.</p>
    <div id="stor"></div>
  </section>
</main>
<nav>
  <button id="t-dispensa" onclick="vai('dispensa')"><span>🥫</span>Dispensa</button>
  <button id="t-famiglia" onclick="vai('famiglia')"><span>👨‍👩‍👧</span>Famiglia</button>
  <button id="t-piatti" onclick="vai('piatti')"><span>🍽️</span>Piatti</button>
  <button id="t-storico" onclick="vai('storico')"><span>📅</span>Storico</button>
</nav>
<div class="ov hide" id="mod"><div class="sheet" id="sheet"></div></div>

<script>
// ====== Configurazione Firebase ======
const FIREBASE_CONFIG={
  apiKey: "AIzaSyAcYuvprYe6Fzjq-faNMsEnyObTV3YhpNU",
  authDomain: "what-to-eat-5c4f1.firebaseapp.com",
  projectId: "what-to-eat-5c4f1",
  storageBucket: "what-to-eat-5c4f1.firebasestorage.app",
  messagingSenderId: "442609192332",
  appId: "1:442609192332:web:5b2cfa09b1b20aee41daa9"
};
const URL_APP="https://matteo09avogadri-ai.github.io/What-To-Eat/"; // indirizzo pubblico dell'app
const online=typeof firebase!=="undefined";
let db=null; if(online){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();}

const GG=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"],PP=["colazione","pranzo","cena"];
const TIT={home:"Cosa mangio",dispensa:"Dispensa",famiglia:"Famiglie",piatti:"Piatti",storico:"Storico"};
const EMO={pasta:"🍝",riso:"🍚",uova:"🥚",latte:"🥛",pane:"🍞",pomodor:"🍅",formaggio:"🧀",mozzarella:"🧀",parmigiano:"🧀",prosciutto:"🥓",guanciale:"🥓",patate:"🥔",cipolla:"🧅",aglio:"🧄",farina:"🌾",zucchero:"🍬",tonno:"🐟",pesce:"🐟",yogurt:"🥣",cereali:"🥣",pollo:"🍗",carne:"🥩",carote:"🥕",zucchine:"🥒",insalata:"🥬",rucola:"🥬",limone:"🍋",mela:"🍎",frutta:"🍓",banana:"🍌",miele:"🍯",burro:"🧈",funghi:"🍄",mais:"🌽",fagioli:"🫘",ceci:"🫘",lenticchie:"🫘",olio:"🫒",peperoncino:"🌶️",basilico:"🌿",biscotti:"🍪",caffè:"☕",pizza:"🍕"};
const BASE=[
 {n:"Pasta al pomodoro",i:["pasta","pomodoro","basilico"],q:{pasta:"100 g",pomodoro:"150 g"}},
 {n:"Carbonara",i:["pasta","uova","guanciale","parmigiano"],q:{pasta:"100 g",uova:"2",guanciale:"50 g",parmigiano:"20 g"}},
 {n:"Frittata",i:["uova","formaggio"],q:{uova:"3",formaggio:"30 g"}},
 {n:"Risotto ai funghi",i:["riso","funghi","cipolla"],q:{riso:"80 g",funghi:"100 g",cipolla:"1"}},
 {n:"Pollo e patate al forno",i:["pollo","patate","rosmarino"],q:{pollo:"200 g",patate:"250 g"}},
 {n:"Caprese",i:["pomodoro","mozzarella","basilico"],q:{pomodoro:"150 g",mozzarella:"125 g"}},
 {n:"Toast",i:["pane","prosciutto","formaggio"],q:{pane:"2",prosciutto:"40 g",formaggio:"30 g"}},
 {n:"Latte e cereali",i:["latte","cereali"],q:{latte:"200 ml",cereali:"40 g"}},
 {n:"Yogurt e frutta",i:["yogurt","frutta"],q:{yogurt:"125 g",frutta:"100 g"}},
 {n:"Pancake",i:["farina","uova","latte","zucchero"],q:{farina:"100 g",uova:"1",latte:"100 ml",zucchero:"20 g"}}
];

// ---- stato ----
let utente="",fams=[],act="",piatti=BASE.slice();            // salvati sul telefono
let membri=[],nomeFam="",dispensa=[],plan=[],proposte=[];   // dalla famiglia attiva (online)
let unsubs=[],pag="home",aperto="",sel=new Map(),controId="",deferred=null,apertoS="",ultimoInvito="";
let undo=[],nav=[];

function salva(){try{localStorage.setItem("cm3",JSON.stringify({utente,fams,act,piatti}))}catch(e){}}
function carica(){
  try{const d=JSON.parse(localStorage.getItem("cm3")||localStorage.getItem("cm2")||"null");
    if(d){utente=d.utente||"";piatti=d.piatti||BASE.slice();fams=d.fams||(d.codice?[{c:d.codice,n:""}]:[]);act=d.act||(fams[0]&&fams[0].c)||""}}catch(e){}
  piatti.forEach(x=>{if(!x.q){const b=BASE.find(y=>y.n===x.n);if(b)x.q=b.q}});
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.trim().toLowerCase();
const ref=()=>db.collection("famiglie").doc(act);
const col=n=>ref().collection(n);
function lun(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const dk=()=>lun()+"|"+utente;
function emoji(n){for(const k in EMO)if(n.includes(k))return EMO[k];return "🍽️"}
const ha=i=>dispensa.some(d=>d.n===i);
const chips=l=>(l||[]).map(i=>`<span class="ing ${ha(i)?'y':'n'}">${esc(i)}</span>`).join("");
const completo=p=>p.i.every(ha);
const per=e=>e.per||"tutti";
const vis=e=>per(e)==="tutti"||per(e)===utente||e.autore===utente;
const fatto=e=>!!(e.done&&e.done[dk()]);
const etich=e=>esc(e.p)+(per(e)==="tutti"?"":" · "+(per(e)===utente?"io":esc(per(e))))+(e.fisso?" 📌":"");

// ---- finestre e avvisi interni ----
function apri(h,c){ensure();$("sheet").className="sheet"+(c?" c":"");$("sheet").innerHTML=h;$("mod").classList.remove("hide")}
function chiudi(){$("mod").classList.add("hide")}
let _tt=null;
function toast(m,az){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.innerHTML=esc(m)+(az?'<b onclick="annulla()">Annulla</b>':"");t.style.display="block";clearTimeout(_tt);_tt=setTimeout(()=>{t.style.display="none"},az?6000:2600)}
window.alert=toast;
function reg(m,inv){undo.push({m,inv});if(undo.length>30)undo.shift();toast(m,true);uiUndo()}
function annulla(){const a=undo.pop();uiUndo();if(!a)return;Promise.resolve(a.inv()).then(()=>toast("Annullato: "+a.m)).catch(()=>alert("Non riesco ad annullare."))}
function uiUndo(){$("un").classList.toggle("hide",!undo.length)}
function aggiorna(){toast("Aggiorno…");setTimeout(()=>location.reload(),300)}
let _cf=null;
function conferma(m,f){_cf=f;apri(`<h2 style="margin-top:0;font-size:18px">${esc(m)}</h2><button class="b w" onclick="chiudi();_cf()">Sì</button><button class="g" style="width:100%;margin-top:8px" onclick="chiudi()">No</button>`,true)}

// ---- nome e avvio ----
function chiediNome(){apri(`<h2 style="margin-top:0">Benvenuto!</h2><p class="sub">Come ti chiami?</p><input id="wN" placeholder="Il tuo nome"><button class="b w" onclick="impostaNome()">Inizia</button>`,true)}
function impostaNome(){const v=$("wN").value.trim();if(!v)return;utente=v;salva();chiudi();avvia()}
function cambiaNome(){apri(`<h2 style="margin-top:0">Il tuo nome</h2><input id="wN" value="${esc(utente)}"><button class="b w" onclick="salvaNome()">Salva</button>`,true)}
function salvaNome(){
  const v=$("wN").value.trim();if(!v)return;
  const vecchio=utente;utente=v;salva();chiudi();
  if(online)fams.forEach(f=>{const r=db.collection("famiglie").doc(f.c);r.update({members:firebase.firestore.FieldValue.arrayRemove(vecchio)}).then(()=>r.update({members:firebase.firestore.FieldValue.arrayUnion(v)}))});
  draw();
}
function avvia(){
  if(!online){draw();return}
  const c=(new URLSearchParams(location.search).get("famiglia")||"").toUpperCase();
  if(c){try{history.replaceState(null,"",location.pathname)}catch(e){}
    if(!fams.some(f=>f.c===c)){entra(c);return}
    act=c;salva()}
  if(!fams.length){creaFam("Casa di "+utente);return}
  attiva();
}

// ---- famiglie ----
function attiva(){
  unsubs.forEach(f=>f());unsubs=[];membri=[];dispensa=[];plan=[];proposte=[];nomeFam="";
  if(!online||!act){draw();return}
  const f=fams.find(x=>x.c===act);if(!f&&fams.length){act=fams[0].c;salva()}
  unsubs.push(ref().onSnapshot(d=>{const x=d.data()||{};membri=x.members||[];nomeFam=x.nome||"";const f=fams.find(y=>y.c===act);if(f&&f.n!==nomeFam){f.n=nomeFam;salva()}draw()}));
  const sub=(n,fn)=>unsubs.push(col(n).onSnapshot(sn=>{fn(sn.docs.map(d=>Object.assign({id:d.id},d.data())));draw()}));
  sub("dispensa",a=>{dispensa=a.sort((x,y)=>x.n.localeCompare(y.n))});
  sub("planner",a=>{plan=a});
  sub("proposte",a=>{proposte=a.sort((x,y)=>y.ts-x.ts)});
}
function creaFam(nome){
  nome=(nome||"").trim()||"La mia famiglia";
  const L="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=L[Math.floor(Math.random()*L.length)];
  db.collection("famiglie").doc(c).set({nome,members:[utente]}).then(()=>{fams.push({c,n:nome});act=c;salva();$("cNome").value="";attiva();toast("Famiglia creata!")}).catch(()=>alert("Non riesco a creare la famiglia."));
}
function entra(c){
  c=(c||"").trim().toUpperCase();if(!c)return;
  if(fams.some(f=>f.c===c)){cambiaFam(c);return}
  const r=db.collection("famiglie").doc(c);
  r.get().then(d=>{
    if(!d.exists){alert("Codice non trovato.");return}
    return r.update({members:firebase.firestore.FieldValue.arrayUnion(utente)}).then(()=>{fams.push({c,n:(d.data()||{}).nome||""});act=c;salva();attiva();vai("famiglia");toast("Sei entrato nella famiglia!")});
  }).catch(()=>alert("Non riesco a entrare. Controlla la connessione."));
}
function cambiaFam(c){act=c;salva();attiva();toast("Famiglia cambiata")}
function esci(c){
  conferma("Uscire da questa famiglia?",()=>{
    db.collection("famiglie").doc(c).update({members:firebase.firestore.FieldValue.arrayRemove(utente)}).catch(()=>{});
    fams=fams.filter(f=>f.c!==c);
    if(act===c)act=fams[0]?fams[0].c:"";
    salva();
    if(!fams.length)creaFam("Casa di "+utente);else attiva();
  });
}
function baseUrl(){
  if(URL_APP)return URL_APP.replace(/[?#].*$/,"");
  if(location.protocol.startsWith("http"))return location.origin+location.pathname.replace(/index\.html$/,"");
  return "";
}
function copiaLink(){
  const base=baseUrl();
  if(!base){alert("Metti prima l'app online per creare un link d'invito.");return}
  ultimoInvito=`Entra nella famiglia "${nomeFam||act}" su Cosa mangio: ${base}?famiglia=${act}\nCodice famiglia: ${act}`;
  if(navigator.share){navigator.share({text:ultimoInvito}).catch(()=>{});return}
  apri(`<h2 style="margin-top:0">Invita un familiare</h2><a class="b w" style="display:block;text-align:center;text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(ultimoInvito)}">Invia su WhatsApp</a><button class="g" style="width:100%;margin-top:8px" onclick="navigator.clipboard.writeText(ultimoInvito);chiudi();toast('Link copiato')">Copia il link</button>`);
}

// ---- dispensa condivisa ----
function addCibo(){
  const n=norm($("dN").value);if(!n){alert("Scrivi il nome del cibo.");return}
  if(!act){alert("Prima entra in una famiglia.");return}
  const C=col("dispensa");C.add({n,s:$("dS").value,q:$("dQ").value.trim()||"—"}).then(r=>reg("Cibo aggiunto: "+n,()=>C.doc(r.id).delete()));
  $("dN").value=$("dS").value=$("dQ").value="";$("dS").type="text";$("fd").classList.add("hide");
}
function togliCibo(id){aperto="";const x=dispensa.find(d=>d.id===id);if(!x)return;const C=col("dispensa"),{n,s,q}=x;C.doc(id).delete();reg("Cibo tolto: "+n,()=>C.doc(id).set({n,s:s||"",q}))}
function testoScad(s){
  if(!s)return{t:"Nessuna scadenza",r:false};
  const d=Math.round((new Date(s+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
  if(d<0)return{t:`Scaduto da ${-d} ${-d===1?"giorno":"giorni"}`,r:true};
  if(d===0)return{t:"Scade oggi",r:true};
  return{t:`Scade tra ${d} ${d===1?"giorno":"giorni"}`,r:d<=3};
}
function uiDisp(){
  $("lista").innerHTML=dispensa.length?dispensa.map(c=>{
    const sc=testoScad(c.s),op=aperto===c.id;
    return `<div class="food" onclick="aperto=aperto==='${c.id}'?'':'${c.id}';uiDisp()"><div class="e">${emoji(c.n)}</div><div class="nm">${esc(c.n)}</div><div>${op?"▲":"▼"}</div>
    ${op?`<div class="d"><span class="${sc.r?'soon':''}"><b>${sc.t}</b></span>${c.s?" ("+c.s.split("-").reverse().join("/")+")":""}<br>Quantità: <b>${esc(c.q)}</b><br><button class="g r" style="margin-top:8px" onclick="event.stopPropagation();togliCibo('${c.id}')">Rimuovi</button></div>`:""}</div>`}).join(""):'<p class="empty">La dispensa è vuota. Tocca "Aggiungi cibo".</p>';
}

// ---- quantità ----
function parseQ(s){const m=/^\s*(\d+(?:[.,]\d+)?)\s*([a-zA-Z]*)/.exec(s||"");if(!m)return null;let v=parseFloat(m[1].replace(",",".")),u=m[2].toLowerCase();if(u==="kg"){v*=1000;u="g"}else if(u==="gr"){u="g"}else if(u==="l"||u==="lt"){v*=1000;u="ml"}return{v,u}}
const fmtQ=p=>Math.round(p.v*100)/100+(p.u?" "+p.u:"");
function usa(e){
  const C=col("dispensa"),inv=[];
  for(const nome of e.i){
    const c=dispensa.find(d=>d.n===nome);if(!c)continue;
    const p=parseQ(c.q);if(!p)continue;
    let q=parseQ(e.q&&e.q[nome]);if(!q||q.u!==p.u)q={v:1,u:p.u};
    const orig={n:c.n,s:c.s||"",q:c.q};
    p.v-=q.v;
    if(p.v<=0)C.doc(c.id).delete();else C.doc(c.id).update({q:fmtQ(p)});
    inv.push(()=>C.doc(c.id).set(orig));
  }
  return()=>Promise.all(inv.map(f=>f()));
}

// ---- planner condiviso ----
const cellaE=k=>plan.filter(e=>e.slot===k&&vis(e)&&(e.fisso||e.sett===lun()));
function tabHtml(get,click,nx){
  let h="<tr><th></th>"+PP.map(p=>`<th>${p[0].toUpperCase()+p.slice(1)}</th>`).join("")+"</tr>";
  for(let g=0;g<7;g++){h+=`<tr><th>${GG[g]}</th>`;
    for(const p of PP){const k=g+"-"+p,es=get(k);
      h+=`<td class="${es.length?'has':''} ${k===nx?'nx':''}" ${click?`onclick="cella('${k}')"`:""}>${es.map(e=>`<div class="${fatto(e)?'d':''}">${etich(e)}</div>`).join("")}</td>`}
    h+="</tr>"}
  return h;
}
function uiHome(){
  const nuove=pend().length;
  $("avviso").innerHTML=(nuove?`<div class="card" style="background:var(--saffron);color:#1D2B1A;font-weight:700" onclick="vai('famiglia')">🔔 ${nuove} ${nuove===1?"proposta da valutare":"proposte da valutare"}</div>`:"")+
    (deferred?`<div class="card" style="background:var(--green);color:#fff;font-weight:700" onclick="installa()">📲 Installa l'app sul telefono</div>`:"");
  const s=(new Date().getDay()+6)%7;let f=null;
  for(let i=0;i<7&&!f;i++){const g=(s+i)%7;for(const p of PP){const es=cellaE(g+"-"+p).filter(e=>!fatto(e));if(es.length){f={g,p,es};break}}}
  $("prossimo").innerHTML=f?`<div class="card next"><div class="when">Prossimo pasto · ${GG[f.g]} · ${f.p}</div>`+f.es.map(e=>`<h3>${etich(e)}</h3><div>${chips(e.i)}</div><button class="b w" onclick="completato('${e.id}')">Completato</button>`).join("")+`</div>`
    :`<div class="card next"><div class="when">Prossimo pasto</div><p class="empty">${act?"Nessun pasto in programma. Tocca una casella della tabella per aggiungerne uno.":"Entra in una famiglia dalla pagina Famiglie."}</p></div>`;
  $("tab").innerHTML=tabHtml(cellaE,true,f&&f.g+"-"+f.p);
}
function completato(id){
  const e=plan.find(x=>x.id===id);if(!e)return;
  const R=col("planner"),fp=new firebase.firestore.FieldPath("done",dk());
  const rip=!Object.keys(e.done||{}).some(k=>k.startsWith(lun()+"|"))?usa(e):null;   // ingredienti scalati una sola volta
  R.doc(id).update(fp,true);
  reg("Pasto completato: "+e.p,()=>{R.doc(id).update(fp,firebase.firestore.FieldValue.delete());return rip?rip():null});
}
function cella(k){
  if(!act){alert("Prima entra in una famiglia.");return}
  const[g,p]=k.split("-");
  apri(`<h2 style="margin-top:0">${GG[g]} · ${p}</h2>`+cellaE(k).map(e=>`<div class="m"><span class="n">${etich(e)}</span><button class="g r" onclick="chiudi();togliPlan('${e.id}')">Togli</button></div>`).join("")+`<button class="b w" onclick="scegli('${k}')">➕ Aggiungi un piatto</button>`);
}
function togliPlan(id){const e=plan.find(x=>x.id===id);if(!e)return;const R=col("planner"),d=Object.assign({},e);delete d.id;R.doc(id).delete();reg("Piatto tolto: "+e.p,()=>R.doc(id).set(d))}
function scegli(k){
  apri(`<h2 style="margin-top:0">Scegli un piatto</h2>`+piatti.map((x,i)=>`<div class="card" onclick="opzioni('${k}',${i})"><b>${esc(x.n)}</b> ${completo(x)?'<span class="ing y">hai tutto</span>':''}<div>${chips(x.i)}</div></div>`).join(""));
}
function opzioni(k,i){
  apri(`<h2 style="margin-top:0">${esc(piatti[i].n)}</h2>
  <label class="l">Per chi?<select id="aPer"><option value="${esc(utente)}">Solo per me</option><option value="tutti">Per tutti</option>${membri.filter(m=>m!==utente).map(m=>`<option value="${esc(m)}">Solo per ${esc(m)}</option>`).join("")}</select></label>
  <label class="l">Quando?<select id="aRip"><option value="0">Solo questa settimana</option><option value="1">📌 Fisso ogni settimana</option><option value="2">📌 Fisso tutti i giorni (questo pasto)</option></select></label>
  <button class="b w" onclick="aggiungiPlan('${k}',${i})">Aggiungi</button>`);
}
function aggiungiPlan(k,i){
  const pe=$("aPer").value,rip=+$("aRip").value,x=piatti[i],pasto=k.split("-")[1];
  const base={p:x.n,i:x.i,q:x.q||{},per:pe,autore:utente,fisso:rip>0,sett:rip>0?null:lun(),done:{}};
  const b=db.batch(),R=col("planner"),refs=[];
  (rip===2?GG.map((_,g)=>g+"-"+pasto):[k]).forEach(sl=>{const r=R.doc();refs.push(r);b.set(r,Object.assign({slot:sl},base))});
  b.commit().then(()=>{chiudi();reg("Aggiunto al planner: "+x.n,()=>{const d=db.batch();refs.forEach(r=>d.delete(r));return d.commit()})}).catch(()=>alert("Non riesco ad aggiungere."));
}
function uiStor(){
  const w=[...new Set(plan.filter(e=>!e.fisso&&e.sett<lun()&&vis(e)).map(e=>e.sett))].sort().reverse();
  $("stor").innerHTML=w.length?w.map(s=>{
    const a=new Date(s+"T00:00:00"),b=new Date(a);b.setDate(b.getDate()+6);
    const f=d=>d.getDate()+"/"+(d.getMonth()+1),op=apertoS===s;
    return `<div class="card" onclick="apertoS=apertoS==='${s}'?'':'${s}';uiStor()"><b>Dal ${f(a)} al ${f(b)}/${b.getFullYear()}</b> ${op?"▲":"▼"}${op?`<table style="margin-top:10px">${tabHtml(k=>plan.filter(e=>e.slot===k&&e.sett===s&&vis(e)),false)}</table>`:""}</div>`}).join(""):'<p class="empty">Ancora nessuna settimana passata.</p>';
}

// ---- piatti personali ----
function uiPiatti(){
  const pr=proposte.find(p=>p.id===controId);
  $("cBan").innerHTML=controId?`<div style="background:var(--saffron);color:#1D2B1A;border-radius:10px;padding:10px;margin-bottom:10px"><b>Controproposta</b>${pr?" a "+esc(pr.n)+" di "+esc(pr.autore):""}<br><button class="g" style="margin-top:6px" onclick="controId='';uiPiatti()">Annulla</button></div>`:"";
  $("pSalva").textContent=controId?"Salva e invia controproposta":"Salva piatto";
  $("pChips").innerHTML=dispensa.length?dispensa.map(c=>`<button class="g ${sel.has(c.id)?'on':''}" style="margin:4px 6px 0 0" onclick="tog('${c.id}')">${emoji(c.n)} ${esc(c.n)}</button>`).join(""):'<p class="empty">La dispensa è vuota: scrivi gli ingredienti qui sotto.</p>';
  $("pQty").innerHTML=[...sel].map(([id,q])=>{const c=dispensa.find(x=>x.id===id);return c?`<div class="m"><span class="n">${emoji(c.n)} ${esc(c.n)}<br><small style="font-weight:400;color:var(--soft)">In dispensa: ${esc(c.q)}</small></span><input style="width:130px;margin:0" placeholder="Quantità es. 100 g" value="${esc(q)}" oninput="sel.set('${id}',this.value)"></div>`:""}).join("");
  $("pList").innerHTML=piatti.map((x,i)=>`<div class="card"><b>${esc(x.n)}</b><div>${chips(x.i)}</div><button class="b" style="margin-top:10px" onclick="invia(${i})">Proponi alla famiglia</button> <button class="g r" onclick="togliPiatto(${i})">Elimina</button></div>`).join("");
}
function togliPiatto(i){const x=piatti.splice(i,1)[0];salva();uiPiatti();reg("Piatto eliminato: "+x.n,()=>{piatti.splice(Math.min(i,piatti.length),0,x);salva();uiPiatti()})}
function tog(id){sel.has(id)?sel.delete(id):sel.set(id,"");uiPiatti()}
function salvaPiatto(){
  const n=$("pN").value.trim();
  if([...sel.values()].some(v=>!v.trim())){alert("Scrivi la quantità per ogni ingrediente scelto.");return}
  const q={};
  const extra=$("pX").value.split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const m=/^(.*?)\s+(\d.*)$/.exec(x);if(m){q[norm(m[1])]=m[2];return norm(m[1])}return norm(x)});
  const ing=[];for(const[id,qq]of sel){const c=dispensa.find(x=>x.id===id);if(c){q[c.n]=qq.trim();ing.push(c.n)}}
  ing.push(...extra);
  if(!n||!ing.length){alert("Scrivi il nome e scegli almeno un ingrediente.");return}
  const x={n,i:[...new Set(ing)],q};piatti.push(x);sel.clear();$("pN").value=$("pX").value="";salva();
  if(controId){const id=controId;controId="";inviaContro(id,x);vai("famiglia");return}
  reg("Piatto salvato: "+n,()=>{const j=piatti.indexOf(x);if(j>=0)piatti.splice(j,1);salva();uiPiatti()});
  uiPiatti();
}

// ---- proposte ----
const vp=p=>per(p)==="tutti"||per(p)===utente||p.autore===utente;
const rsp=p=>per(p)==="tutti"?membri.filter(m=>m!==p.autore):[per(p)];
const pend=()=>proposte.filter(p=>vp(p)&&p.autore!==utente&&rsp(p).includes(utente)&&!(p.risposte&&p.risposte[utente]));
function invia(i){
  if(!act){alert("Prima entra in una famiglia.");return}
  apri(`<h2 style="margin-top:0">Proponi "${esc(piatti[i].n)}"</h2><label class="l">A chi?<select id="iPer"><option value="tutti">A tutta la famiglia</option>${membri.filter(m=>m!==utente).map(m=>`<option value="${esc(m)}">Solo a ${esc(m)}</option>`).join("")}</select></label><button class="b w" onclick="spedisci(${i})">Invia proposta</button>`);
}
function spedisci(i){
  const x=piatti[i],pe=$("iPer").value;chiudi();
  const R=col("proposte");R.add({autore:utente,n:x.n,i:x.i,q:x.q||{},ts:Date.now(),risposte:{},per:pe}).then(r=>reg("Proposta inviata: "+x.n,()=>R.doc(r.id).delete())).catch(()=>alert("Invio non riuscito."));
}
function cardProposta(p,par){
  const r=p.risposte||{},mia=r[utente];
  const stato=rsp(p).map(m=>{const x=r[m],ch=proposte.find(c=>c.rif===p.id&&c.autore===m);return esc(m)+": "+(!x?"⏳":x.v==="si"?"✅":x.v==="no"?"❌":"💬 "+(ch?esc(ch.n):"controproposta"))}).join("<br>");
  const on=v=>mia&&mia.v===v?"on":"";
  const bt=p.autore===utente?`<button class="g r" style="margin-top:8px" onclick="elimina('${p.id}')">Elimina</button>`
    :rsp(p).includes(utente)?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="g ${on("si")}" onclick="rispondi('${p.id}','si')">✅ Accetto</button><button class="g ${on("no")}" onclick="rispondi('${p.id}','no')">❌ Rifiuto</button><button class="g" onclick="contro('${p.id}')">💬 Controproposta</button></div>`:"";
  const priv=per(p)==="tutti"?"":` · solo per ${per(p)===utente?"te":esc(per(p))}`;
  return `<div class="card"><div class="when">${par?"↪ "+esc(p.autore)+" contropropone":esc(p.autore)+" propone"}${priv}</div>${par?`<div class="when" style="font-weight:400">in risposta a: ${esc(par.n)}</div>`:""}<h3 style="margin:2px 0 6px;font-size:19px">${esc(p.n)}</h3><div>${chips(p.i)}</div><div style="margin-top:8px;font-size:14px">${stato}</div>${bt}</div>`;
}
function rispondiRaw(id,v){
  const R=col("proposte"),fp=new firebase.firestore.FieldPath("risposte",utente),pr=proposte.find(p=>p.id===id),old=pr&&pr.risposte&&pr.risposte[utente];
  R.doc(id).update(fp,{v});
  return()=>R.doc(id).update(fp,old||firebase.firestore.FieldValue.delete());
}
function rispondi(id,v){reg(v==="si"?"Hai accettato":"Hai rifiutato",rispondiRaw(id,v))}
function inviaContro(id,x){
  const o=proposte.find(p=>p.id===id)||{},radice=o.rif||id,R=col("proposte");
  const inv=rispondiRaw(id,"contro");
  R.add({autore:utente,n:x.n,i:x.i,q:x.q||{},ts:Date.now(),risposte:{},rif:radice,per:per(o)==="tutti"?"tutti":(o.autore||"tutti")}).then(r=>reg("Controproposta inviata",()=>{R.doc(r.id).delete();return inv()}));
}
function contro(id){
  apri(`<h2 style="margin-top:0">Cosa preferisci?</h2><button class="b w" style="margin:0 0 6px" onclick="chiudi();controId='${id}';vai('piatti')">➕ Componi un nuovo piatto</button><p class="sub" style="margin-top:14px">Oppure scegli uno dei tuoi piatti:</p>`+
    piatti.map((x,i)=>`<div class="card" onclick="chiudi();inviaContro('${id}',piatti[${i}])"><b>${esc(x.n)}</b><div>${chips(x.i)}</div></div>`).join(""));
}
function elimina(id){conferma("Eliminare la proposta?",()=>{
  const R=col("proposte"),tutte=proposte.filter(c=>c.id===id||c.rif===id).map(c=>{const d=Object.assign({},c);delete d.id;return{id:c.id,d}});
  tutte.forEach(t=>R.doc(t.id).delete());
  reg("Proposta eliminata",()=>Promise.all(tutte.map(t=>R.doc(t.id).set(t.d))));
})}

// ---- pagina famiglie ----
function uiFam(){
  if(!online){$("famList").innerHTML='<p class="empty">Il collegamento online non è disponibile.</p>';$("famDet").innerHTML="";return}
  $("famList").innerHTML=`<p class="sub">Le tue famiglie. Tocca per passare all'altra.</p>`+fams.map(f=>`<button class="g ${f.c===act?'on':''}" style="margin:0 6px 6px 0" onclick="cambiaFam('${f.c}')">${esc(f.n||f.c)}</button>`).join("");
  if(!act){$("famDet").innerHTML="";return}
  const vp2=proposte.filter(vp),top=vp2.filter(p=>!p.rif||!vp2.some(x=>x.id===p.rif));
  const lista=top.map(p=>cardProposta(p)+vp2.filter(c=>c.rif===p.id).sort((a,b)=>a.ts-b.ts).map(c=>`<div class="cp">${cardProposta(c,p)}</div>`).join("")).join("");
  $("famDet").innerHTML=`<div class="card"><div class="when">Codice ${esc(act)}</div><h3 style="font-size:26px;margin:4px 0 10px;font-family:Georgia,serif">${esc(nomeFam||"La mia famiglia")}</h3><button class="b" onclick="copiaLink()">Invita con un link</button></div>
  <h2>Membri</h2>`+membri.map(m=>`<div class="m"><div class="av s">${esc(m[0].toUpperCase())}</div><span class="n">${esc(m)}${m===utente?" (tu)":""}</span></div>`).join("")+
  `<h2>Proposte</h2>`+(lista||'<p class="empty">Nessuna proposta. Inviane una dalla pagina Piatti.</p>')+
  `<button class="g r" style="margin-top:22px" onclick="esci('${act}')">Esci da questa famiglia</button>`;
}

// ---- navigazione ----
function draw(){
  $("av").textContent=utente?utente[0].toUpperCase():"?";
  $("tit").textContent=pag==="home"?(nomeFam||TIT.home):TIT[pag];
  uiHome();uiDisp();uiFam();uiPiatti();uiStor();uiUndo();
}
function ensure(){if(!history.state||history.state.s!==1)history.pushState({s:1},"")}
function mostra(p){
  pag=p;
  for(const n of Object.keys(TIT)){$("p-"+n).classList.toggle("hide",n!==p);if($("t-"+n))$("t-"+n).classList.toggle("on",n===p)}
  $("home").classList.toggle("hide",p==="home");
  draw();scrollTo(0,0);
}
function vai(p){
  if(p!==pag){nav.push(pag);if(nav.length>15)nav.shift()}
  if(p==="home")nav=[];
  ensure();mostra(p);
}
if(!(history.state&&history.state.s===1)){history.replaceState({s:0},"");history.pushState({s:1},"")}
addEventListener("popstate",()=>{
  if(!$("mod").classList.contains("hide")){chiudi();history.pushState({s:1},"");return}
  if(nav.length){mostra(nav.pop());history.pushState({s:1},"");return}
  toast("Premi ancora indietro per uscire");
});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;draw()});
addEventListener("appinstalled",()=>{deferred=null;draw()});
function installa(){if(deferred){deferred.prompt();deferred=null;draw()}}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
carica();draw();if(!utente)chiediNome();else avvia();
</script>
